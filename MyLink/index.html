
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyLink</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 50px 20px;
        }

        .container {
            max-width: 400px;
            margin: auto;
        }

        h1 {
            color: #333;
        }

        a {
            display: block;
            background: white;
            color: #333;
            text-decoration: none;
            padding: 15px;
            margin: 12px 0;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MyLink</h1>
        <p>나의 링크 모음 페이지</p>

        <a href="https://www.google.com">Google</a>
        <a href="https://www.youtube.com">YouTube</a>
        <a href="https://www.github.com">GitHub</a>
    </div>
</body>
</html>
